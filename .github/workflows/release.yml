name: Release

# Pushing a tag such as 4.0.0 (or v4.0.0) releases that version: the tag sets the extension version.
on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Browsers only accept 1 to 4 dot-separated integers, without a pre-release suffix.
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a valid extension version (like 4.0.0)"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          npm pkg set version="$version"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check, lint and test
        run: pnpm check
      - name: Build Chrome and Firefox zips
        run: |
          pnpm zip
          pnpm zip:firefox
      - name: Create the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: .output/*.zip
      - name: Upload to the Chrome Web Store and submit for review
        run: pnpm submit:chrome
        env:
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
